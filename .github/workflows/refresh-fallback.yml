name: Refresh PoE2 fallback snapshot

# 定期從「官方 GGG 商城」重新產生 fallback.json 快照並提交。
#
# 三個作用：
#  1) 伺服器端容錯：所有來源臨時掛掉時，部署環境用倉庫內這份快照兜底。
#  2) 備援來源：提交後 jsDelivr 會快取此檔
#     （cdn.jsdelivr.net/gh/Oiii-bin/poe2-deals@main/fallback.json），
#     成為 server.js DATA_SOURCES 的社群之後的第 2 個來源。
#     ⚠️ 實測部署環境連不到 raw.githubusercontent.com，但連得到 cdn.jsdelivr.net，
#        所以備援一定要走 jsDelivr，不要用 raw。
#  3) 保持倉庫活躍：GitHub 對 60 天無活動的倉庫會自動停用排程 Actions。
#
# ⚠️ 排程 Actions 在尖峰時可能延遲數十分鐘，屬正常現象。
on:
  schedule:
    # 每 6 小時跑一次（UTC 01/07/13/19 時 17 分 ≈ 北京 09/15/21/03 時 17 分）
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch: {}   # 也可在 Actions 頁面手動觸發

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build snapshot (official + community, with TW enrichment)
        # build_fallback.js 管線（與 server.js fetchSource() 一致）：
        #  1) 官方 GGG 商城（pathofexile2.com/api/shop-microtransactions?game=poe2
        #     ＋ pathofexile.com/shop/category/specials）→ 官方件帶臺服繁中 twName/twDesc
        #  2) 社群源 usaginest 補官方漏掉的組合包內容物
        #  3) 社群源經 enName 對照表補繁中（有 twMap 才補，否則留英文，絕不偽造）
        #  4) 聯集：官方為主，社群補官方沒有的（依 english.name 去重）
        # ⚠️ 容錯：官方爬蟲失敗 → 退社群源（無法補繁中，仍是有效備援）；兩者皆空才拋錯。
        #    這一步已涵蓋舊版「scrape_official.js -o」＋「聯集社群」＋「官方失敗退社群源」三個步驟。
        run: node build_fallback.js fallback.json

      - name: Validate JSON before committing
        run: |
          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('fallback.json', 'utf8'));
            if (!Array.isArray(j.items) || j.items.length === 0) {
              console.error('❌ fallback.json 沒有 items，放棄提交');
              process.exit(1);
            }
            // 僅結構性校驗：有名稱 + 價格為數值即可。
            // ⚠️ 不再強制 discount<original：本站現含 kind:"new" 新品（discount==original，無打折），
            //    折扣空窗期幾乎全是新品，舊規則會把整批判異常而放棄提交。折扣關係只對 kind:"discount" 商品要求。
            const bad = j.items.filter(x =>
              !x.english?.name ||
              !(typeof x.price?.discount === 'number' && typeof x.price?.original === 'number') ||
              (x.kind === 'discount' && !(x.price.discount < x.price.original))
            );
            if (bad.length) {
              console.error('❌ 有 ' + bad.length + ' 筆資料異常（無名稱或無折扣），放棄提交');
              process.exit(1);
            }
            console.log('✅ 快照有效：date=' + j.date + ' items=' + j.items.length
              + ' 帶結束時間=' + j.items.filter(x => x.specialEnd).length);
          "

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fallback.json
          if git diff --cached --quiet; then
            echo "fallback.json 無變動，略過提交"
          else
            git commit -m "chore: refresh PoE2 fallback snapshot ($(date -u +%Y-%m-%dT%H:%M)Z)"
            git push
          fi
